# share-installs – Dev Overrides (Local Development)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# This file adds local development features:
#   - Direct port access (bypass Traefik)
#   - Source code mounting (hot-reload)
#   - Local API connectivity

services:
  traefik:
    scale: 0

  dashboard:
    build:
      context: ./dashboard
      target: development
    environment:
      - VITE_API_PROXY_TARGET=http://backend:6066
    volumes:
      - ./dashboard:/app
      - /app/node_modules # Prevent host node_modules from overriding container's
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MULTI_TENANT: ${MULTI_TENANT:-true}
      ADMIN_SECRET: ${ADMIN_SECRET:-05d92ec1489cf6120dc8072686437e0eb8300a493337908ba25ace0a6ee1273b}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-d5913a7ec4a1669da9f06dbdace2666f52ed795cf8a091167667e6a50d85602e}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0e70d6723080a0d9d98d3c80ae9e89359e59e10a99fa0fb12b275452198acde6}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_PRO_MONTHLY: ${PADDLE_PRICE_PRO_MONTHLY:-pri_placeholder_pro_monthly}
      PADDLE_PRICE_PRO_YEARLY: ${PADDLE_PRICE_PRO_YEARLY:-pri_placeholder_pro_yearly}
      PADDLE_PRICE_UNLIMITED_MONTHLY: ${PADDLE_PRICE_UNLIMITED_MONTHLY:-pri_placeholder_unlimited_monthly}
      PADDLE_PRICE_UNLIMITED_YEARLY: ${PADDLE_PRICE_UNLIMITED_YEARLY:-pri_placeholder_unlimited_yearly}
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
      - ./backend/prisma.config.ts:/app/prisma.config.ts:ro
      - ./examples:/app/examples:ro
      - ./sdk/js/dist:/app/sdk/js/dist:ro
    ports:
      - "${BACKEND_PORT:-6066}:6066"
    command: npm run dev

  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
