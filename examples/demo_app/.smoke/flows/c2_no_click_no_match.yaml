# C2 — 无点击时不得凭空匹配（见 .smoke/plan.md）
# 前置由 run_core_smoke.sh 完成（**必须通过它运行**）：清空本设备近期未解析的 click，
# 并用 adb 冷启动 App —— 原因见 c1 用例头部说明。
appId: com.shareinstalls.demo_app
tags:
  - mutates-conversions
  - core
---
# 后端地址由安装时的 --dart-define=SI_API_BASE_URL 烧入，用例不碰输入框：
# Maestro 在 Android 上 inputText 含 "://" 的串会吞字符，eraseText 也不可靠。
# 等 App 真正到前台（MIUI 上 launchApp 返回后界面可能还没切过来），
# 再滚动定位按钮 —— 真机 720x1650 比模拟器矮，Configure 按钮不在首屏。
- extendedWaitUntil:
    visible: ".*ShareInstalls Demo.*"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "config_submit_btn"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "config_submit_btn"
- extendedWaitUntil:
    visible: ".*SDK configured successfully.*"
    timeout: 15000

- tapOn:
    id: "actions_resolve_btn"

# 断言：明确的「无匹配」，而不是随便给一个邀请码
# 结果卡片渲染在可滚动区域下方 —— 边等边滚，再断言结果本身
- scrollUntilVisible:
    element:
      id: "result_json_text"
    direction: DOWN
    timeout: 25000
- assertVisible: ".*matched.*false.*"
- assertNotVisible: ".*Invite resolved.*"
