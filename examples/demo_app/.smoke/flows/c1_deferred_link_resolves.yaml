# C1 — 同设备点击后可解析（见 .smoke/plan.md）
# 需要环境变量：CODE（本轮唯一邀请码）
#
# 前置动作由 run_core_smoke.sh 用 adb 完成，**必须通过它运行**：
#   1. 在设备浏览器里打开落地页并自动上报点击
#   2. force-stop + am start 冷启动本 App
# 为什么不写在 flow 里：MIUI 会拦截 Maestro 驱动进程发起的应用启动（launchApp 返回成功
# 但进程起不来），而 adb 直接 am start 是通的。
appId: com.shareinstalls.demo_app
tags:
  - mutates-conversions
  - core
---
# 后端地址由安装时的 --dart-define=SI_API_BASE_URL 烧入，用例不碰输入框：
# Maestro 在 Android 上 inputText 含 "://" 的串会吞字符，eraseText 也不可靠。
# 等 App 真正到前台（MIUI 上 launchApp 返回后界面可能还没切过来），
# 再滚动定位按钮 —— 真机 720x1650 比模拟器矮，Configure 按钮不在首屏。
# runner 已用 adb 冷启动本 App（MIUI 会拦截 Maestro 驱动进程发起的**启动**）。
# 这里只是把已存在的任务拉回前台 —— Maestro 起会话时会把自己的驱动顶到前台，
# 模拟器上本 App 首绘要 5s+，不拉回来就会被挤到后台甚至回收。
- launchApp:
    appId: com.shareinstalls.demo_app
- extendedWaitUntil:
    visible: ".*ShareInstalls Demo.*"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "config_submit_btn"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "config_submit_btn"
# 状态徽标不进无障碍树，改断控制台里那条真实成功日志（同一事实，稳定节点）
- extendedWaitUntil:
    visible: ".*SDK configured successfully.*"
    timeout: 15000

- tapOn:
    id: "actions_resolve_btn"

# --- 断言：拿回的必须是本轮点的那个邀请码 ---
# 结果卡片渲染在可滚动区域下方，解析是异步的 —— 边等边滚
- scrollUntilVisible:
    element:
      id: "result_json_text"
    direction: DOWN
    timeout: 25000
- assertVisible: ".*${CODE}.*"
- assertNotVisible: ".*No matching invite found.*"
